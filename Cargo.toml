[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/clavis-shell",
    "apps/desktop/src-tauri",
    "apps/mobile/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.6.0"

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
clavis-shell = { path = "crates/clavis-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
csv = "1"
