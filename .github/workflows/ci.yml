name: CI

# Desktop + tests. Mobile Signet ship (APK/IPA) is `.github/workflows/signet-ship.yml`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Manual full CI (desktop matrix) without moving a release tag
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.9)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: vault-core tests
        run: pnpm test:vault

      - name: Web TypeScript
        run: pnpm --filter @clavis/web exec tsc --noEmit

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    needs: test
    # Tags = release artifacts. workflow_dispatch = re-run full matrix without retagging.
    # Regular main/PR pushes skip desktop (cheap gate only).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.9)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux WebKit / Tauri deps
        if: runner.os == 'Linux'
        run: |
          # Tauri 2 Debian/Ubuntu recipe — do NOT install libappindicator3-dev
          # (conflicts with libayatana-appindicator3-dev on Ubuntu 22.04+).
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build desktop (self-signed / unsigned)
        run: pnpm build

      - name: Collect artifacts + checksums
        shell: bash
        run: |
          mkdir -p release-out
          # Cargo workspace builds land in repo-root target/, not apps/desktop/src-tauri/target/
          BUNDLE=""
          for candidate in target/release/bundle apps/desktop/src-tauri/target/release/bundle; do
            if [ -d "$candidate" ]; then
              BUNDLE="$candidate"
              break
            fi
          done
          echo "Using bundle dir: ${BUNDLE:-"(none)"}"
          if [ -n "$BUNDLE" ]; then
            find "$BUNDLE" -type f \( \
              -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \
              -o -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
            \) -print 2>/dev/null | while read -r f; do
              cp "$f" release-out/ || true
            done
            # macOS .app is a directory — zip it for upload
            find "$BUNDLE" -type d -name '*.app' -print 2>/dev/null | while read -r appdir; do
              base="$(basename "$appdir")"
              (cd "$(dirname "$appdir")" && zip -r -q "${OLDPWD}/release-out/${base}.zip" "$base") || true
            done
          fi
          if [ -z "$(ls -A release-out 2>/dev/null)" ]; then
            for bin in \
              target/release/keys-manager.exe \
              target/release/keys-manager \
              apps/desktop/src-tauri/target/release/keys-manager.exe \
              apps/desktop/src-tauri/target/release/keys-manager \
              apps/desktop/src-tauri/target/release/clavis.exe \
              apps/desktop/src-tauri/target/release/clavis
            do
              cp "$bin" release-out/ 2>/dev/null || true
            done
          fi
          ls -la release-out || true
          node scripts/checksum-release.mjs --out "release-out/SHA256SUMS-${{ matrix.artifact }}.txt" release-out

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: clavis-${{ matrix.artifact }}-${{ github.ref_name }}
          path: release-out/
          if-no-files-found: warn

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
