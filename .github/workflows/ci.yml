name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: vault-core tests
        run: pnpm test:vault

      - name: Web TypeScript
        run: pnpm --filter @clavis/web exec tsc --noEmit

  windows-build:
    name: Windows Tauri build
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebView2 (usually present) & deps
        run: pnpm install --frozen-lockfile

      - name: Build desktop (self-signed / unsigned)
        run: pnpm build

      - name: Collect artifacts + checksums
        shell: bash
        run: |
          mkdir -p release-out
          # Bundle outputs vary by Tauri target; scoop common installer/bin patterns
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \) \
            -print 2>/dev/null | while read -r f; do
              cp "$f" release-out/
            done
          # Fallback: ship the main executable if no bundle yet
          if [ -z "$(ls -A release-out 2>/dev/null)" ]; then
            cp apps/desktop/src-tauri/target/release/keys-manager.exe release-out/ 2>/dev/null || true
            cp apps/desktop/src-tauri/target/release/clavis.exe release-out/ 2>/dev/null || true
          fi
          ls -la release-out
          node scripts/checksum-release.mjs --out release-out/SHA256SUMS.txt release-out

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clavis-windows-${{ github.ref_name }}
          path: release-out/
          if-no-files-found: warn
