name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.9)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: vault-core tests
        run: pnpm test:vault

      - name: Web TypeScript
        run: pnpm --filter @clavis/web exec tsc --noEmit

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.9)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux WebKit / Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build desktop (self-signed / unsigned)
        run: pnpm build

      - name: Collect artifacts + checksums
        shell: bash
        run: |
          mkdir -p release-out
          BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          if [ -d "$BUNDLE" ]; then
            find "$BUNDLE" -type f \( \
              -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \
              -o -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
            \) -print 2>/dev/null | while read -r f; do
              cp "$f" release-out/ || true
            done
            # macOS .app is a directory — zip it for upload
            find "$BUNDLE" -type d -name '*.app' -print 2>/dev/null | while read -r appdir; do
              base="$(basename "$appdir")"
              (cd "$(dirname "$appdir")" && zip -r -q "${OLDPWD}/release-out/${base}.zip" "$base") || true
            done
          fi
          if [ -z "$(ls -A release-out 2>/dev/null)" ]; then
            cp apps/desktop/src-tauri/target/release/keys-manager.exe release-out/ 2>/dev/null || true
            cp apps/desktop/src-tauri/target/release/keys-manager release-out/ 2>/dev/null || true
            cp apps/desktop/src-tauri/target/release/clavis.exe release-out/ 2>/dev/null || true
            cp apps/desktop/src-tauri/target/release/clavis release-out/ 2>/dev/null || true
          fi
          ls -la release-out || true
          node scripts/checksum-release.mjs --out "release-out/SHA256SUMS-${{ matrix.artifact }}.txt" release-out

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clavis-${{ matrix.artifact }}-${{ github.ref_name }}
          path: release-out/
          if-no-files-found: warn
